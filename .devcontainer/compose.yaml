services:
  dev:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile

    environment:
      PYTHONBUFFERED: 1
      UV_LINK_MODE: copy
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/atlas_dev

    container_name: atlas-api-dev
    depends_on:
      postgres:
        condition: service_healthy

    volumes:
      - ..:/workspaces/atlas-api

    command: sleep infinity

  postgres:
    image: postgres:17
    container_name: atlas-api-postgres
    environment:
      POSTGRES_DB: atlas_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d atlas_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - atlas-postgres-data:/var/lib/postgresql/data

volumes:
  atlas-postgres-data: