[project]
name = "atlas_api"
version = "0.1.0"
readme = "README.md"
authors = [
    { name = "Corbin Hasslinger", email = "corbi@ad.unc.edu" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.5",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.14.2",
    "sqlmodel>=0.0.39",
    "uvicorn>=0.52.0",
]

[build-system]
requires = ["hatchling>=1.13.0,<1.14.0"]    
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
